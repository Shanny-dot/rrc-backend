name: Members report (on demand)

# Emails staff (ADMIN_EMAIL) an Excel report: the day's new members, points, reward requests and
# referrals, and every member's points and status. Not scheduled - run it by hand from the Actions
# tab ("Run workflow") whenever a report is needed.
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Send the report (retries while the server wakes up)
        env:
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 180 -X POST -H "X-Job-Key: $JOB_SECRET" \
                 https://rrc-backend-1dmv.onrender.com/api/v1/jobs/daily-report; then
              echo; exit 0
            fi
            echo "Attempt $attempt failed; retrying in 30s"; sleep 30
          done
          exit 1